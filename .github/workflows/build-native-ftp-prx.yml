name: Build native DEXCORE FTP PRX candidates

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'native/ftp-control/**'
      - '.github/workflows/build-native-ftp-prx.yml'

permissions:
  contents: read

jobs:
  native-prx-candidates:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Fetch pinned HEN plugin sources and submodules
        run: |
          git clone --recurse-submodules https://github.com/Scene-Collective/ps4-hen-plugins.git hen-plugins
          git -C hen-plugins checkout 49534177d69d17609bcc09cd185c88df42fed8b5
          git -C hen-plugins submodule update --init --recursive
      - name: Overlay native FTP runtime and ShellUI hooks
        run: |
          cp -a native/ftp-control/plugin_server/source/. hen-plugins/plugin_server/source/
          cp -a native/ftp-control/plugin_mono/source/. hen-plugins/plugin_mono/source/
          cp native/ftp-control/hen_settings.xml hen-plugins/plugin_mono/data/hen_settings.xml
          cp assets/hen_settings_icon.png hen-plugins/plugin_mono/data/hen_settings_icon.png
          python3 native/ftp-control/tests/check_source.py
      - name: Install toolchain build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y clang llvm lld zip unzip p7zip-full
          command -v llvm-ar && llvm-ar --version | head -1
      - name: Download upstream OpenOrbis PS4 Toolchain
        working-directory: hen-plugins
        run: |
          curl --fail --location --retry 3 -o toolchain-llvm-18.2.zip \
            https://github.com/OpenOrbis/OpenOrbis-PS4-Toolchain/releases/download/v0.5.3/toolchain-llvm-18.2.zip
          unzip -q toolchain-llvm-18.2.zip
          tar -xzf toolchain-llvm-18.tar.gz
          echo "OO_PS4_TOOLCHAIN=$PWD/OpenOrbis/PS4Toolchain" >> "$GITHUB_ENV"
      - name: Compile revised plugin_server and plugin_mono
        working-directory: hen-plugins
        run: |
          bash -e build.sh
          test -s bin/plugins/prx/plugin_server.prx
          test -s bin/plugins/prx/plugin_mono.prx
          sha256sum bin/plugins/prx/plugin_server.prx bin/plugins/prx/plugin_mono.prx
      - name: Write non-deployable compatibility manifest
        run: |
          python3 - <<'PY'
          import hashlib, json
          from pathlib import Path
          mono=Path("hen-plugins/bin/plugins/prx/plugin_mono.prx")
          server=Path("hen-plugins/bin/plugins/prx/plugin_server.prx")
          def info(path):
              data=path.read_bytes()
              return {"bytes":len(data),"sha256":hashlib.sha256(data).hexdigest()}
          manifest={
              "name":"DEXCORE native HEN FTP PRX candidate",
              "tested_on_real_ps4_13_52":False,
              "installed_on_user_console":False,
              "ftp_default_enabled":False,
              "ftp_port":2121,
              "ftp_connect_notification":True,
              "native_mono_original_embedded_slot_bytes":141152,
              "plugin_mono":info(mono),
              "plugin_server":info(server),
              "can_patch_current_flat_hen_payload_in_place":len(mono.read_bytes())<=141152,
              "current_live_host_uses_these_new_prxs":False
          }
          Path("native-ftp-build-manifest.json").write_text(json.dumps(manifest,indent=2)+"\n")
          print(json.dumps(manifest,indent=2))
          PY
      - name: Publish native test binaries only
        uses: actions/upload-artifact@v4
        with:
          name: DEXCORE-Native-FTP-PRX-TEST-UNVERIFIED
          path: |
            hen-plugins/bin/plugins/prx/plugin_server.prx
            hen-plugins/bin/plugins/prx/plugin_mono.prx
            native/ftp-control/README.md
            native-ftp-build-manifest.json
          retention-days: 30
          if-no-files-found: error
