name: DEXCore on-console ShellUI plugin repair kit

on:
  push:
    branches: [main]
    paths:
      - 'loader/dexcore.bin'
      - 'shellui/hen_settings.xml'
      - 'scripts/prepare-dexcore-plugin.py'
      - 'scripts/repair-dexcore-plugin.py'
      - '.github/workflows/dexcore-plugin-repair.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  package:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Extract exact installed-module replacement from SHA-verified payload
        run: |
          python3 scripts/prepare-dexcore-plugin.py
          python3 -m compileall -q scripts/repair-dexcore-plugin.py
      - name: Preserve recovery guide and installer alongside checked PRX
        run: |
          cp scripts/repair-dexcore-plugin.py dist/dexcore-plugin-repair/repair-dexcore-plugin.py
          cp docs/dexcore-plugin-repair.md dist/dexcore-plugin-repair/README.md
      - uses: actions/upload-artifact@v4
        with:
          name: DEXCore-13.52-ShellUI-Plugin-Repair
          path: dist/dexcore-plugin-repair/
          if-no-files-found: error
          retention-days: 30
