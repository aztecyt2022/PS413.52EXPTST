name: Manual legacy fixed-size ShellUI plugin repair kit

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  package:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Recreate the archived fixed-size payload before extracting its PRX
        run: |
          python3 scripts/build-shellui-preview.py --output /tmp/dexcore-legacy-fixed-size.bin
          python3 scripts/prepare-dexcore-plugin.py --source /tmp/dexcore-legacy-fixed-size.bin
          python3 -m compileall -q scripts/repair-dexcore-plugin.py
      - name: Preserve recovery guide and installer alongside checked PRX
        run: |
          cp scripts/repair-dexcore-plugin.py dist/dexcore-plugin-repair/repair-dexcore-plugin.py
          cp docs/dexcore-plugin-repair.md dist/dexcore-plugin-repair/README.md
      - uses: actions/upload-artifact@v4
        with:
          name: DEXCore-13.52-LEGACY-Fixed-Size-Plugin-Repair
          path: dist/dexcore-plugin-repair/
          if-no-files-found: error
          retention-days: 30
