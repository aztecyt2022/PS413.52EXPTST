name: Archived standalone FTP source (manual inspection only)

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  archived:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Confirm old FTP upload path is retired
        run: |
          test ! -e dist/loader/user-ftp.bin
          grep -q 'loader/dexcore.bin' scripts/build.mjs || true
          echo "The website no longer deploys or launches the standalone FTPS4 payload."
