name: Build HENACY V1.2 native PS4 kit

on:
  push:
    branches: [main]
    paths:
      - 'native/vsh/**'
      - 'scripts/build-vsh.py'
      - 'scripts/package-vsh.py'
      - '.github/workflows/build-henacy-vsh.yml'
  workflow_dispatch:

jobs:
  build-native-ps4:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - name: Install PS4 cross-build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y clang lld
      - name: Fetch OpenOrbis v0.5.4 SDK
        run: |
          curl --fail --location --retry 3 --retry-delay 2 \
            "https://github.com/OpenOrbis/OpenOrbis-PS4-Toolchain/releases/download/v0.5.4/toolchain-llvm-18.tar.gz" \
            --output /tmp/openorbis-v0.5.4.tar.gz
          mkdir -p "$GITHUB_WORKSPACE/sdk"
          tar -xzf /tmp/openorbis-v0.5.4.tar.gz -C "$GITHUB_WORKSPACE/sdk"
          test -f "$GITHUB_WORKSPACE/sdk/OpenOrbis/PS4Toolchain/bin/linux/create-fself"
          test -f "$GITHUB_WORKSPACE/sdk/OpenOrbis/PS4Toolchain/link.x"
      - name: Host logic and packaging regression
        run: npm run test:vsh
      - name: Compile real PS4 x86-64 VSH module and dedicated test payload
        run: |
          python3 scripts/build-vsh.py \
            --sdk "$GITHUB_WORKSPACE/sdk/OpenOrbis/PS4Toolchain" \
            --cc clang --ld ld.lld \
            --out "$GITHUB_WORKSPACE/builds/vsh-v1.2"
      - name: Verify and package V1.2 console test kit
        run: |
          python3 scripts/package-vsh.py --folder "$GITHUB_WORKSPACE/builds/vsh-v1.2"
          python3 - <<'PY'
          import json, zipfile
          from pathlib import Path
          folder=Path("builds/vsh-v1.2")
          metadata=json.loads((folder/"manifest.json").read_text())
          assert metadata["version"]=="1.2.0"
          assert metadata["runtime_tested_on_ps4"] is False
          with zipfile.ZipFile(folder/"HENACY-VSH-1.2-PS4-Test-Kit.zip") as pkg:
              assert pkg.testzip() is None
          print("Native PS4 V1.2 kit structurally verified; console runtime not validated.")
          PY
      - name: Publish installable PS4 test kit as workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: HENACY-V1.2-PS4-ShellUI-Test-Kit
          path: builds/vsh-v1.2/
          if-no-files-found: error
          retention-days: 30
